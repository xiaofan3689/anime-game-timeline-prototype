  <div class="shell">
    <header class="topbar"><div class="brand"><button id="admin-entry" class="brand-mark" type="button" title="双击进入活动管理" aria-label="双击进入活动管理">✦</button><span>次元时刻</span></div><div class="top-actions"><button id="apply-collaborator" type="button">申请协作者</button><button id="choose-games" type="button">选择游戏</button><a class="admin-link" href="/collaborator/">操作后台</a><span id="clock"></span><button id="refresh" type="button">↻ 立即刷新</button></div></header>
    <main id="main-content">
      <div class="cover-spread">
        <section class="hero"><div><h1><span>游戏活动</span><em>时刻表</em></h1><p class="hero-copy">把各款游戏的活动放进同一张时刻表。按时间浏览，随时查看最新同步结果。</p><div class="hero-meta"><span class="pulse"></span><span id="sync-status">正在读取活动数据…</span><span class="dot">·</span><span id="updated-at">尚未同步</span></div><nav class="dashboard-shortcuts" aria-label="活动快捷导航"><a href="#smart-panel">今天先做什么</a><a href="#version-events">版本大事件</a><a href="#activity-timeline">横向活动时间线</a></nav></div><div class="hero-character" aria-hidden="true"><img src="/assets/games/1118end.png" alt="" decoding="async"></div></section>
        <section id="activity-overview" class="activity-overview" aria-label="我的活动概览"><h2 class="overview-title">我的活动</h2><p class="overview-scope">正在加载活动数量…</p></section>
      </div>
      
      <section id="smart-panel" class="smart-panel" aria-label="活动助手"></section><section class="content" id="activity-timeline"><div class="section-heading"><div><h2>横向活动时间线 <span id="event-count">0</span></h2><p class="timeline-guide-help">点击游戏引导线可快速跳转至对应游戏下方</p></div><p>横向滚动查看日期 · 时间按设备时区显示</p></div><div class="toolbar"><div class="filters" role="group" aria-label="活动状态"><button class="active" data-status="all">全部</button><button data-status="live">进行中</button><button data-status="upcoming">即将开始</button><button data-status="ended">已结束</button></div><div class="searches"><label><span class="sr-only">搜索活动</span><input id="search" type="search" placeholder="搜索游戏或活动…"></label><label><span class="sr-only">筛选游戏</span><select id="game-filter"><option value="all">全部游戏</option></select></label></div></div><div id="timeline" class="timeline" aria-live="polite"></div><p class="timeline-guide-help">点击游戏引导线可快速跳转至对应游戏下方</p><div class="timeline-meta"><span>数据更新 <strong id="side-updated">—</strong></span><span>来源状态 <strong id="source-summary">—</strong></span><a href="https://starrailassistant.top/reference/public-api/" target="_blank" rel="noopener noreferrer">数据来源说明 ↗</a></div></section>
    </main><footer>次元时刻 · 多游戏活动时间，一处查看 <span>数据版本 v1</span></footer>
