<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>活动管理 · 次元时刻</title><link rel="stylesheet" href="/admin/style.css?v=18"><link rel="stylesheet" href="/responsive.css?v=18"></head>
<body><main><header><div><a href="/">← 返回时间线</a><h1>活动管理</h1><p>编辑活动，保存后将提交至 GitHub，并触发活动同步。</p></div><strong id="state">正在验证身份…</strong></header>
<div class="actions"><button id="retry" type="button">重新连接 / 加载最新数据</button><button id="backup" type="button">导出人工数据备份</button><a href="/admin/setup.html">查看中文配置指南</a></div><section id="manager" class="editor" hidden><h2>游戏与活动管理</h2><label>选择游戏<select id="manage-game-filter"></select></label><div class="actions"><button id="edit-selected-game" type="button">编辑此游戏属性</button><button id="add-selected-event" type="button">为此游戏新增活动</button></div><div id="managed-events"></div></section><section class="layout"><aside><div class="section-title"><h2>游戏属性</h2><button id="manage-games" type="button">管理</button><button id="new-game">新增</button></div><div id="game-list"></div><div class="section-title"><h2>活动</h2><button id="manage-events" type="button">管理</button><button id="new-event">新增</button></div><div id="event-list"></div></aside><section class="editor"><h2 id="editor-title">选择一项进行编辑</h2><form id="game-form" hidden><label>游戏 ID<input name="id" required pattern="[a-z0-9-]{2,40}" placeholder="例如 mygame"></label><label>游戏名称<input name="name" required maxlength="80"></label><label>游戏图标地址（HTTPS 或 /assets/ 路径）<input name="iconUrl" type="text" required></label><label>版本号<input name="version"></label><label>版本名称<input name="versionName"></label><label>版本 Banner URL<input name="bannerUrl" type="text"></label><label>版本公告时间（北京时间）<input name="versionNoticeAt" type="datetime-local"></label><label>下版本更新时间（北京时间）<input name="nextVersionAt" type="datetime-local"></label><label><input name="nextVersionEstimated" type="checkbox">这是推算时间，尚未官宣</label><button id="estimate-version" type="button">按公告时间 +42 天推算</button><div class="actions"><button type="submit">保存到草稿</button><button type="button" class="danger" id="delete-game">删除游戏</button></div></form><form id="event-form" hidden><label>所属游戏<select name="gameId" required></select></label><label>活动名称<input name="title" required maxlength="160"></label><label>分类<input name="category" value="活动"></label><label>开始时间（北京时间）<input name="startAt" type="datetime-local" required></label><label>结束时间（北京时间）<input name="endAt" type="datetime-local" required></label><label>活动 Banner HTTPS URL<input name="imageUrl" type="text"></label><label>公告 HTTPS URL<input name="sourceUrl" type="url"></label><div class="actions"><button type="submit">保存到草稿</button><button type="button" class="danger" id="delete-event">删除活动</button></div></form><div class="publish"><p id="summary">尚未加载</p><button id="publish" disabled>提交到 GitHub</button></div></section></section></main><script src="/admin/app.js?v=18" defer></script></body></html>
