<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>活动管理 · 次元时刻</title><link rel="stylesheet" href="/admin/style.css?v=18"><link rel="stylesheet" href="/responsive.css?v=18"><link rel="stylesheet" href="/admin/navigation.css?v=54"><link rel="stylesheet" href="/admin/fold.css?v=73"></head>
<body><main><header><div><a href="/">← 返回时间线</a><h1>活动管理</h1><p>编辑活动，保存后将提交至 GitHub，并触发活动同步。</p></div><strong id="state">正在验证身份…</strong></header>
<nav class="actions admin-nav" aria-label="管理导航"><a href="/admin/" aria-current="page">游戏与活动管理</a><a href="/admin/approvals.html">协作者审批管理</a><a href="/admin/feedback.html">用户反馈审理区</a><a href="/admin/collaborator-proposals.html">协作者修改审批</a></nav><div class="actions admin-tools"><button id="retry" type="button">重新连接 / 加载最新数据</button><button id="clear-applications" type="button">清除协作者申请数据</button><button id="send-test-email" type="button">发邮件</button><button id="backup" type="button">导出人工数据备份</button><a href="/admin/setup.html">查看中文配置指南</a></div><p id="test-email-status" role="status" aria-live="polite">测试邮件读取当前浏览器首页选择与完成标记，发送到同一域名已验证的提醒邮箱。</p><section id="manager" class="editor" hidden><h2>游戏与活动管理</h2><label>选择游戏<select id="manage-game-filter"></select></label><div class="actions"><button id="edit-selected-game" type="button">编辑此游戏属性</button><button id="add-selected-event" type="button">为此游戏新增活动</button></div><div id="managed-events"></div></section><section class="layout"><aside><section class="admin-fold-section"><div class="section-title"><h2><button class="admin-fold-toggle" type="button" aria-expanded="false" aria-controls="game-list">游戏属性<span aria-hidden="true"> ▸</span></button></h2><button id="manage-games" type="button">管理</button><button id="new-game" type="button">新增</button></div><div id="game-list" hidden></div></section><section class="admin-fold-section"><div class="section-title"><h2><button class="admin-fold-toggle" type="button" aria-expanded="false" aria-controls="event-list">活动<span aria-hidden="true"> ▸</span></button></h2><button id="manage-events" type="button">管理</button><button id="new-event" type="button">新增</button></div><div id="event-list" hidden></div></section></aside><section class="editor"><h2 id="editor-title">选择一项进行编辑</h2><form id="game-form" hidden><label>游戏 ID<input name="id" required pattern="[a-z0-9-]{2,40}" placeholder="例如 mygame"></label><label>游戏名称<input name="name" required maxlength="80"></label><label>游戏图标地址（HTTPS 或 /assets/ 路径）<input name="iconUrl" type="text" required></label><label><input name="syncWithSra" type="checkbox">跟随 SRA 同步版本号、版本名和版本 Banner</label><label>版本号<input name="version"></label><label>版本名称<input name="versionName"></label><label>版本 Banner URL<input name="bannerUrl" type="text"></label><label>版本回顾长图 URL（HTTPS 或 /assets/ 路径）<input name="previewRecapUrl"></label><label>前瞻直播 Banner<input name="previewBannerUrl"></label><label>Bilibili 直播间 HTTPS 地址<input name="previewUrl" type="url"></label><label>前瞻开启时间（北京时间）<input name="previewAt" type="datetime-local"></label><label>兑换码（每行一个）<textarea name="previewCodes" rows="4"></textarea></label><label>兑换码统一截止时间（北京时间）<input name="codesExpireAt" type="datetime-local"></label><label>游戏官网 HTTPS 地址<input name="officialUrl" type="url"></label><label>上版本更新时间（北京时间，可校正）<input name="previousVersionAt" type="datetime-local"></label><label>预下载开启时间（北京时间）<input name="preDownloadAt" type="datetime-local"></label><label>版本公告时间（北京时间）<input name="versionNoticeAt" type="datetime-local"></label><label>下版本更新时间（北京时间）<input name="nextVersionAt" type="datetime-local"></label><div class="version-save-options"><label><input name="nextVersionEstimated" type="checkbox">这是推算时间，尚未官宣</label><label><input id="version-info-only" type="checkbox">非版更当天，仅信息同步</label><small>仅对本次编辑生效：不自动修改上版本更新时间。</small></div><button id="estimate-version" type="button">按公告时间 +42 天推算</button><div class="actions"><button type="submit">保存到草稿</button><button type="button" class="danger" id="delete-game">删除游戏</button></div></form><form id="event-form" hidden><label><input type="checkbox" name="dailyCheckin">日签活动</label><label>所需签到次数<input type="number" name="checkinTarget" min="1" max="366" value="1"></label><label>活动网址<input type="url" name="activityUrl" placeholder="https://"></label><label>所属游戏<select name="gameId" required></select></label><label><input name="featured" type="checkbox">精华活动（展示在版本大事件）</label><label>活动名称<input name="title" required maxlength="160"></label><label>分类<input name="category" value="活动"></label><label>开始时间（北京时间）<input name="startAt" type="datetime-local" required></label><label>结束时间（北京时间）<input name="endAt" type="datetime-local" required></label><label>活动 Banner HTTPS URL<input name="imageUrl" type="text"></label><label>公告 HTTPS URL<input name="sourceUrl" type="url"></label><div class="actions"><button type="submit">保存到草稿</button><button type="button" class="danger" id="delete-event">删除活动</button></div></form><div class="publish"><p id="summary">尚未加载</p><button id="publish" disabled>提交到 GitHub</button></div></section></section></main><script src="/admin/app.js?v=60" defer></script><script src="/admin/applications.js?v=50" defer></script><script src="/admin/email-test.js?v=56" defer></script><script src="/admin/fold.js?v=73" defer></script><script src="/operation-status.js?v=103" defer></script><script src="/date-year-guard.js?v=107" defer></script></body></html>
