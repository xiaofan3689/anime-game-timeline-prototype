<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>活动管理 · 次元时刻</title><link rel="stylesheet" href="/admin/style.css"></head>
<body><main><header><div><a href="/">← 返回时间线</a><h1>活动管理</h1><p>编辑人工活动，保存后将提交至 GitHub，并触发活动同步。</p></div><strong id="state">正在验证身份…</strong></header>
<section class="layout"><aside><div class="section-title"><h2>人工游戏</h2><button id="new-game">新增</button></div><div id="game-list"></div><div class="section-title"><h2>人工活动</h2><button id="new-event">新增</button></div><div id="event-list"></div></aside><section class="editor"><h2 id="editor-title">选择一项进行编辑</h2><form id="game-form" hidden><label>游戏 ID<input name="id" required pattern="[a-z0-9-]{2,40}" placeholder="例如 mygame"></label><label>游戏名称<input name="name" required maxlength="80"></label><label>游戏图标 HTTPS URL<input name="iconUrl" type="url" required></label><label>版本号<input name="version"></label><label>版本名称<input name="versionName"></label><label>版本 Banner URL<input name="bannerUrl" type="url"></label><div class="actions"><button type="submit">保存到草稿</button><button type="button" class="danger" id="delete-game">删除游戏</button></div></form><form id="event-form" hidden><label>所属游戏<select name="gameId" required></select></label><label>活动名称<input name="title" required maxlength="160"></label><label>分类<input name="category" value="活动"></label><label>开始时间（北京时间）<input name="startAt" type="datetime-local" required></label><label>结束时间（北京时间）<input name="endAt" type="datetime-local" required></label><label>活动 Banner HTTPS URL<input name="imageUrl" type="url"></label><label>公告 HTTPS URL<input name="sourceUrl" type="url"></label><div class="actions"><button type="submit">保存到草稿</button><button type="button" class="danger" id="delete-event">删除活动</button></div></form><div class="publish"><p id="summary">尚未加载</p><button id="publish" disabled>提交到 GitHub</button></div></section></section></main><script src="/admin/app.js" defer></script></body></html>
