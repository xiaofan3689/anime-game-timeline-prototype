name: Sync game events
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: event-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build shared JSON
        run: python scripts/sync.py
      - name: Commit changed feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/events.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update game events'
            git push origin HEAD:main
          fi
      - name: Prepare site
        run: |
          mkdir -p public/data
          cp index.html styles.css styles-extra.css app.js public/
          cp data/events.json public/data/
          touch public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
