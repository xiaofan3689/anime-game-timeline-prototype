name: Sync game events
on:
  workflow_dispatch:
  repository_dispatch:
    types: [manual-events-updated]
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'data/manual.json'
      - '.github/workflows/sync.yml'
  schedule:
    - cron: '17 */2 * * *'
permissions:
  contents: write
concurrency:
  group: event-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build shared JSON
        run: python scripts/sync.py
      - name: Validate shared JSON
        run: python -m json.tool data/events.json > /dev/null
      - name: Commit changed feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              # Ephemeral runner only: regenerate from latest code and manual edits.
              git reset --hard origin/main
              python scripts/sync.py
              python -m json.tool data/events.json > /dev/null
            fi
            git add data/events.json
            if git diff --cached --quiet; then
              echo "Feed is already up to date"
              exit 0
            fi
            git commit -m 'Update game events'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Remote changed; rebuilding from latest main (attempt $attempt)"
          done
          echo "Push failed after three attempts; no force push was used"
          exit 1
