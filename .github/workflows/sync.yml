name: Sync game events
on:
  workflow_dispatch:
  repository_dispatch:
    types: [manual-events-updated]
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'data/manual.json'
      - '.github/workflows/sync.yml'
  schedule:
    - cron: '17 */2 * * *'
permissions:
  contents: write
concurrency:
  group: event-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build shared JSON
        run: python scripts/sync.py
      - name: Validate shared JSON
        run: python -m json.tool data/events.json > /dev/null
      - name: Commit changed feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/events.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update game events'
            git push origin HEAD:main
          fi
